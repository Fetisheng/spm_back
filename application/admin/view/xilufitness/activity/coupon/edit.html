<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" placeholder="请输入" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Meet_amount')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-meet_amount" min="0" placeholder="请输入" data-rule="required" class="form-control" name="row[meet_amount]" type="number" value="{$row.meet_amount|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Discount_amount')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-discount_amount" min="0" placeholder="请输入" data-rule="required" class="form-control" name="row[discount_amount]" type="number" value="{$row.discount_amount|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Expire_day')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-expire_day" min="0" placeholder="请输入"  class="form-control" name="row[expire_day]" type="number" value="{$row.expire_day|htmlentities}">
                <div class="input-group-addon">/{:__('Day')}</div>
            </div>
            <span class="help-block" style="color: red;">{:__('How many days after self collection is valid, 0 is unlimited')}</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Coupon_count')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-coupon_count" min="0" placeholder="请输入" class="form-control" name="row[coupon_count]" type="number" value="{$row.coupon_count|htmlentities}">
            <span class="help-block" style="color: red;">{:__('Distribution quantity, 0 is unlimited')}</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_activity')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios("row[is_activity]",[0 => __('Is_activity_0'), 1 => __('Is_activity_1')],htmlentities($row.is_activity))}
        </div>
    </div>

    <div class="form-group" {eq name="row.is_activity" value="0"} style="display: none;" {/eq}>
        <label class="control-label col-xs-12 col-sm-2">{:__('Invite_num')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invite_num" min="0" placeholder="请输入" class="form-control" name="row[invite_num]" type="number" value="{$row.invite_num|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
