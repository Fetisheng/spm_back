<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡名称')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-card-name" placeholder="请输入" data-rule="required" class="form-control" name="row[cardname]" type="text" value="{$row.cardname|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡类型')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-card-type" type="hidden" data-rule="required" class="form-control" type="text" value="2">
            <select  id="c-card-type-name" class="form-control selectpicker">
                <option value="2">时长卡</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡封面')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-coach_avatar" placeholder="请上传" class="form-control" size="50" name="row[card_avatar]" type="text" value="{$row.card_avatar|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-coach_avatar" class="btn btn-danger faupload" data-input-id="c-coach_avatar" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-coach_avatar"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-coach_avatar" class="btn btn-primary fachoose" data-input-id="c-coach_avatar" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-coach_avatar"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-coach_avatar"></ul>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡简介')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-card-desc" class="form-control editor" rows="2" name="row[card_desc]" cols="50">{$row.card_desc|htmlentities}</textarea>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('售价(元)')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-card-price" placeholder="请输入" data-rule="required" class="form-control" name="row[cardprice]" type="number" value="{$row.cardprice|htmlentities}">
                <div class="input-group-addon">{:__('(元)')}</div>
            </div>
        </div>
    </div>

    <div class="form-group row">
        <label class="control-label col-xs-12 col-sm-2">{:__('有效期')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-2">
            <div class="input-group">
                <input id="c-expire-times" placeholder="请输入" class="form-control" size="50" name="row[expiretimes]" type="text" value="{$row.expiretimes|htmlentities}">
            </div>
        </div>
        <div class="col-xs-12 col-sm-2">
            <select  id="c-expire-type" class="form-control selectpicker" name="row[expiretype]">
                <option value="1" {if $row.expiretype=='1'}selected{/if}>天</option>
                <option value="2" {if $row.expiretype=='2'}selected{/if}>周</option>
                <option value="3" {if $row.expiretype=='3'}selected{/if}>月</option>
                <option value="4" {if $row.expiretype=='4'}selected{/if}>年</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('门店名称')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-shop-name" class="form-control editor" rows="2" name="row[shop_name]" cols="50">{$row.shop_name|htmlentities}</textarea>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('使用限制')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-use-limits" class="form-control editor" rows="2" name="row[use_limits]" cols="50">{$row.use_limits|htmlentities}</textarea>
        </div>
    </div>



    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('适用门店')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-apply-shop" class="form-control editor" rows="2" name="row[apply_shop]" cols="50">{$row.apply_shop|htmlentities}</textarea>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('适用课种')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-apply-course" class="form-control editor" rows="2" name="row[apply_course]" cols="50">{$row.apply_course|htmlentities}</textarea>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">

            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>

        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('展示顺序')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-card-sort" placeholder="请输入" data-rule="required" class="form-control" name="row[sort]" type="number" value="{$row.sort|htmlentities}">
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
