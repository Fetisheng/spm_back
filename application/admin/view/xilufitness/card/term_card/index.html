<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading(null, false)}
        <ul class="nav nav-tabs">
            <li><a href="{:url('xilufitness/card/times_card')}">{:__('次卡')}</a></li>
            <li class="active"><a href="{:url('xilufitness/card/term_card')}">{:__('时长卡')}</a></li>
            <li><a href="{:url('xilufitness/card/course_card')}">{:__('课程次卡')}</a></li>
        </ul>
    </div>

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh,add')}
                    </div>
                    <table id="card-table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('xilufitness/card/term_card/edit')}"
                           data-operate-del="{:$auth->check('xilufitness/card/term_card/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
