<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="1"/>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('选择用户')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-user_id" data-rule="required" placeholder="请选择用户" min="0" data-source="xilufitness/user/index" data-field="nickname" class="form-control selectpage" name="row[user_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡类型')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-inline" data-toggle="cxselect" data-selects="province,city">
                <select class="province form-control" name="次卡">
                    <option>请选择</option>
                    <option value="1">次卡</option>
                    <option value="2">时长卡</option>
                    <option value="4">课程次卡</option>
                </select>
                <select id="card_category_id" data-rule="required" class="city form-control" name="row[card_category_id]" data-query-name="card_type" data-url="xilufitness/card/user_card/get_card_category"></select>
            </div>
        </div>
    </div>

    <div class="form-group" style="display: none;">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡信息')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8" id="card_info">

        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('生效日期')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                <input id="c-effective_date" min="0" placeholder="请选择" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[effective_date]" type="text" value="">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('售卡门店')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            {if condition="!empty($fitness_shop_id)"}
            <input id="c-shop_ids" placeholder="请选择" data-max-select-limit="1" data-rule="required" data-source="xilufitness/shop/index" data-field="shop_name"  class="form-control selectpage" name="row[shop_id]" type="text" value="{$fitness_shop_id}" disabled>
            {else/}
            <input id="c-shop_ids" placeholder="请选择" data-max-select-limit="1" data-rule="required" data-source="xilufitness/shop/index" data-field="shop_name" class="form-control selectpage" name="row[shop_id]" type="text" value="">
            {/if}
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('实收金额')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-card-price" placeholder="请输入" data-rule="required" class="form-control" name="row[actual_price]" type="number">
                <div class="input-group-addon">{:__('(元)')}</div>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('支付方式')}:<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type" data-rule="required" class="form-control selectpicker" name="row[pay_type]">
                {foreach name="payList" item="vo"}
                <option value="{$key}" {in name="key" value=""}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="1"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>

        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('备注')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark_content" class="form-control editor" rows="5" name="row[remark]" cols="50"></textarea>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
