<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[user_card_id]" data-rule="required" id="c-user-card-id" value="{$row.id|htmlentities}"/>

    <div class="form-group">
        <label for="nickname" class="control-label col-xs-12 col-sm-2">{:__('会员卡卡号')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" readonly class="form-control" id="card_no" autocomplete="off" value="{$row.card_no|htmlentities}"/>
        </div>
    </div>

    <div class="form-group">
        <label for="nickname" class="control-label col-xs-12 col-sm-2">{:__('会员卡名称')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" readonly class="form-control" id="card_name" autocomplete="off" value="{$row.category.cardname|htmlentities}" />
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('会员卡类型')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" disabled='disabled'>
                <option value="1" {if $row.category.cardtype=='1'}selected{/if}>次卡</option>
                <option value="2" {if $row.category.cardtype=='2'}selected{/if}>时长卡</option>
                <option value="4" {if $row.category.cardtype=='4'}selected{/if}>课程次卡</option>
            </select>
        </div>
    </div>

    {if $row.card_type=='1'}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('次卡剩余次数')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-times-card-quota" readonly placeholder="请输入" data-rule="required" class="form-control" type="number" value="{$row.left_times_count|htmlentities}">
                <div class="input-group-addon">{:__('(次)')}</div>
            </div>
        </div>
    </div>
    {/if}

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('生效日期')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                <input id="c-effective_date" readonly min="0" placeholder="请选择" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" type="text" value="{$row.effective_date|htmlentities}">
            </div>

        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('有效期止期')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                <input id="c-expire_time" min="0" readonly placeholder="请选择" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" type="text" value="{$row.expire_time|htmlentities}">
            </div>

        </div>
    </div>

    <div class="form-group">
        <label for="nickname" class="control-label col-xs-12 col-sm-2">{:__('持卡人')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" readonly class="form-control" id="nickname" autocomplete="off" value="{$row.user.nickname|htmlentities}"/>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('核销门店')}:<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type" data-rule="required" class="form-control selectpicker" name="row[shop_id]">
                <option>请选择</option>
                {foreach name="shopList" item="vo"}
                <option value="{$vo.value}">{$vo.name}</option>
                {/foreach}
            </select>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('一键核销')}</button>
        </div>
    </div>
</form>
