<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="brand_id" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Lable_name')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-lable_name" data-rule="required" placeholder="请输入" class="form-control" name="row[lable_name]" type="text" value="{$row.lable_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Lable_type')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-lable_type" class="form-control selectpicker" name="row[lable_type]">
                {foreach name="lableTypeList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.lable_type"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Weigh')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-weigh" min="0" class="form-control" name="row[weigh]" type="number" value="{$row.weigh|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
