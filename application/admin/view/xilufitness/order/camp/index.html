<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading(null, false)}
        <ul class="nav nav-tabs">
            <li ><a href="{:url('xilufitness/order/index')}">{:__('Recharge_order')}</a></li>
            <li ><a href="{:url('xilufitness/order/card')}">{:__('User_Card_order')}</a></li>
            <li ><a href="{:url('xilufitness/order/card_package')}">{:__('Card_Package_order')}</a></li>
            <li><a href="{:url('xilufitness/order/course')}">{:__('Course_order_1')}</a></li>
            <li><a href="{:url('xilufitness/order/personal')}">{:__('Course_order_2')}</a></li>
            <li class="active"><a href="{:url('xilufitness/order/camp')}">{:__('Camp_order')}</a></li>
        </ul>
    </div>

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('xilufitness/order/camp/edit')?'':'hide'}" title="{:__('Edit')}" ><i class="fa fa-pencil"></i> {:__('Edit')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('xilufitness/order/camp/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>

                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('xilufitness/order/camp/edit')}"
                           data-operate-del="{:$auth->check('xilufitness/order/camp/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
