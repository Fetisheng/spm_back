<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" value="{$row.brand_id|htmlentities}"/>
    <input type="hidden" name="row[username]" value="{$row.username|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shop_name')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shop_name" placeholder="请输入" data-rule="required" class="form-control" name="row[shop_name]" type="text" value="{$row.shop_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shop_mobile')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shop_mobile" placeholder="请输入" data-rule="required;mobile" class="form-control" name="row[shop_mobile]" type="text" value="{$row.shop_mobile|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shop_image')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-shop_image" placeholder="请上传" data-rule="required" class="form-control" size="50" name="row[shop_image]" type="text" value="{$row.shop_image|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-shop_image" class="btn btn-danger faupload" data-input-id="c-shop_image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-shop_image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-shop_image" class="btn btn-primary fachoose" data-input-id="c-shop_image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-shop_image"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-shop_image"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shop_images')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-shop_images" placeholder="请上传" data-rule="required" class="form-control" size="50" name="row[shop_images]" type="textarea" value="{$row.shop_images|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-shop_images" class="btn btn-danger faupload" data-input-id="c-shop_images" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="true" data-preview-id="p-shop_images"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-shop_images" class="btn btn-primary fachoose" data-input-id="c-shop_images" data-mimetype="image/*" data-multiple="true"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-shop_images"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-shop_images"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Province_city_area')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-inline" data-toggle="cxselect" data-selects="province,city,area">
                <select data-rule="required" class="province form-control" name="row[province_id]" data-url="xilufitness/shop/index/get_area">
                    <option value="{$row.province_id|htmlentities}"></option>
                </select>
                <select data-rule="required" class="city form-control" name="row[city_id]" data-query-name="province" data-url="xilufitness/shop/index/get_area">
                    <option value="{$row.city_id|htmlentities}"></option>
                </select>
                <select data-rule="required" class="area form-control" name="row[area_id]" data-query-name="city" data-url="xilufitness/shop/index/get_area">
                    <option value="{$row.area_id|htmlentities}"></option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-lat" class="form-control" name="row[lat]" value="{$row.lat|htmlentities}" type="hidden">
            <input id="c-lng" class="form-control" name="row[lng]" value="{$row.lng|htmlentities}" type="hidden">
            <input id="c-address" class="form-control" name="row[address]" type="text" value="{$row.address|htmlentities}">
            <span class="help-block text-red">选择经纬度前，请先安装《地图位置(经纬度)选择插件》</span>
        </div>
        <a href="javascript:;" class="btn btn-primary" data-toggle="addresspicker" data-input-id="c-address" data-lat-id="c-lat" data-lng-id="c-lng" title="{:__('Map_lat_lng')}" ><i class="fa fa-plus"></i> {:__('Map_lat_lng')}</a>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Star')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-star" min="0" class="form-control" name="row[star]" type="number" value="{$row.star|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
