<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('User_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-user_id" min="0" readonly data-source="xilufitness/user/index" data-field="nickname" class="form-control selectpage" name="row[user_id]" type="text" value="{$row.user_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Media_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-media_id" min="0" readonly data-source="xilufitness/activity/medal" data-field="medal_name" class="form-control selectpage" name="row[media_id]" type="text" value="{$row.media_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Train_duration')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-train_duration" min="0" readonly class="form-control" step="0.1" name="row[train_duration]" type="number" value="{$row.train_duration|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
