<div class="panel panel-default panel-intro">
    {if condition="!empty($user_id)"}
    <div class="panel-heading">
        {:build_heading(null, false)}
        <ul class="nav nav-tabs">
            <li><a href="{:url('xilufitness/user/account')}?user_id={$user_id}">{:__('余额明细')}</a></li>
            <li><a href="{:url('xilufitness/user/user_point')}?user_id={$user_id}">{:__('积分明细')}</a></li>
            <li><a href="{:url('xilufitness/user/collect')}?user_id={$user_id}">{:__('收藏明细')}</a></li>
            <li><a href="{:url('xilufitness/user/coupon')}?user_id={$user_id}">{:__('代金券明细')}</a></li>
            <li class="active"><a href="{:url('xilufitness/user/media')}?user_id={$user_id}">{:__('勋章解锁记录')}</a></li>
            <li><a href="{:url('xilufitness/user/comment')}?user_id={$user_id}">{:__('评论记录')}</a></li>
        </ul>
    </div>
    {else /}
        {:build_heading()}
    {/if}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('xilufitness/user/media/edit')?'':'hide'}" title="{:__('Edit')}" ><i class="fa fa-pencil"></i> {:__('Edit')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('xilufitness/user/media/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('xilufitness/user/media/edit')}"
                           data-operate-del="{:$auth->check('xilufitness/user/media/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
