<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="1"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" placeholder="请输入" data-rule="required" class="form-control" name="row[title]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Rule_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:Form::radios("row[rule_type]", $typeList, 1)}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Appoint_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:Form::radios("row[point_type]", [1 => __('Type_1'), 2 => __('Type_2')], 1)}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Point_amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-point_amount" placeholder="请输入" class="form-control" name="row[point_amount]" type="number">
        </div>
    </div>
    <div class="form-group" style="display: none;">
        <label class="control-label col-xs-12 col-sm-2">{:__('Point_ratio')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-point_ratio" placeholder="请输入" class="form-control" step="1" max="100" name="row[point_ratio]" type="number">
                <div class="input-group-addon">/%</div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="normal"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
