<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" placeholder="请输入" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Rule_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:Form::radios("row[rule_type]", $typeList, $row.rule_type)}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Appoint_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:Form::radios("row[point_type]", [1 => __('Type_1'), 2 => __('Type_2')], $row.point_type)}
        </div>
    </div>
    <div class="form-group" {eq name="row.point_type" value="2"} style="display: none;" {/eq}>
        <label class="control-label col-xs-12 col-sm-2">{:__('Point_amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-point_amount" placeholder="请输入"  class="form-control" name="row[point_amount]" type="number" value="{$row.point_amount|htmlentities}">
        </div>
    </div>
    <div class="form-group" {eq name="row.point_type" value="1"} style="display: none;" {/eq}>
        <label class="control-label col-xs-12 col-sm-2">{:__('Point_ratio')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-point_ratio" placeholder="请输入" class="form-control" step="1" max="100" name="row[point_ratio]" type="number" value="{$row.point_ratio|htmlentities}">
                <div class="input-group-addon">/%</div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
