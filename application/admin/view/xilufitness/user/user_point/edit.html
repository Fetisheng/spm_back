<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="{$row.brand_id|default='1'}"/>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('User_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            {if condition="!empty($fitness_brand_id)"}
            <input id="c-user_id" data-rule="required" readonly min="0" data-source="xilufitness/user/index" data-field="nickname" class="form-control selectpage" name="row[user_id]" type="text" value="{$row.user_id|htmlentities}" disabled>
            {else/}
            <input id="c-user_id" data-rule="required" readonly min="0" data-source="xilufitness/user/index" data-field="nickname" class="form-control selectpage" name="row[user_id]" type="text" value="{$row.user_id|htmlentities}">
            {/if}
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" readonly class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Before_point')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-before_point" readonly min="0" class="form-control" name="row[before_point]" type="number" value="{$row.before_point|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Point')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-point" readonly min="0" class="form-control" name="row[point]" type="number" value="{$row.point|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('After_point')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-after_point" readonly min="0" class="form-control" name="row[after_point]" type="number" value="{$row.after_point|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Rule_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:Form::radios("row[rule_type]",$rule_types,$row.rule_type,['disabled' => 'disabled'])}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Point_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:Form::radios("row[point_type]",[1=> __('Add_point'), 2 => __('Dec_point')],$row.point_type,['disabled' => 'disabled'])}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
