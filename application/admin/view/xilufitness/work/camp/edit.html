<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Camp_id')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-camp_id" placeholder="请选择" data-rule="required" data-source="xilufitness/course/camp/index" data-field="title" class="form-control selectpage" name="row[camp_id]" type="text" value="{$row.camp_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shop_id')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shop_id" min="0" placeholder="请选择" data-rule="required" data-source="xilufitness/shop/index" data-field="shop_name" data-multiple="true" class="form-control selectpage" name="row[shop_id]" type="text" value="{$row.shop_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Coach_id')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-coach_id" min="0" placeholder="请选择" data-rule="required" data-source="xilufitness/coach/index" data-field="coach_name" class="form-control selectpage" name="row[coach_id]" type="text" value="{$row.coach_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Camp_duration')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-4">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                <input id="c-start_at" placeholder="请选择" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[start_at]" type="text" value="{$row.start_at ? date('y-m-d',$row.start_at) : ''}">
            </div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                <input id="c-end_at" placeholder="请选择" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[end_at]" type="text" value="{$row.end_at ? date('Y-m-d',$row.end_at) : ''}">
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Class_duration')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-class_duration" placeholder="请输入" data-rule="required" class="form-control" name="row[class_duration]" type="text" value="{$row.class_duration|htmlentities}">
                <div class="input-group-addon">/{:__('Minute')}</div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Sign_count')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sign_count" min="0" placeholder="请输入" data-rule="required" class="form-control" name="row[sign_count]" type="number" value="{$row.sign_count|htmlentities}">
            <span class="help-block" style="color: red;">用户报名可选人数的配置</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Camp_count')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-camp_count" min="0" placeholder="请输入" data-rule="required" class="form-control" name="row[camp_count]" type="number" value="{$row.camp_count|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Total_count')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-total_count" min="0" placeholder="请输入" data-rule="required" class="form-control" name="row[total_count]" type="number" value="{$row.total_count|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Camp_plan')}:</label>
        <div class="col-xs-12 col-sm-8">
            <table class="table table-condensed">
                <tbody id="plan_list">
                <tr>
                    <td>{:__('Plan_date')}</td>
                    <td>{:__('Start_at')}</td>
                    <td>{:__('End_at')}</td>
                    <td><span class="btn btn-success addPlan"><i class="fa fa-plus"></i>{:__('Add_plan')}</span></td>
                </tr>

                {volist name="plan_list" id="vo"}
                    <tr>
                        <input type="hidden" name="row[plan_id][]" value="{$vo.id|htmlentities}"/>
                        <td><input placeholder="请选择" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[day_date][]" type="text" value="{$vo.day_date ? date('Y-m-d',$vo.day_date) : ''}"></td>
                        <td><input placeholder="请选择" data-rule="required" class="form-control datetimepicker" data-date-format="HH:mm" name="row[day_start_at][]" type="text" value="{$vo.day_start_at|htmlentities}"></td>
                        <td><input placeholder="请选择" data-rule="required" class="form-control datetimepicker" data-date-format="HH:mm" name="row[day_end_at][]" type="text" value="{$vo.day_end_at|htmlentities}"></td>
                        <td><span class="btn btn-danger delPlan"><i class="fa fa-trash"></i>{:__('Del_plan')}</span></td>
                    </tr>
                {/volist}

                </tbody>
            </table>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Description')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" placeholder="请输入" class="form-control" name="row[description]" rows="5">{$row.description|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
