<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <input type="hidden" name="row[brand_id]" id="c-brand_id" value="{$row.brand_id|htmlentities}"/>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Course_id')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-course_id" placeholder="请选择" data-rule="required" data-source="xilufitness/course/index" data-field="title" class="form-control selectpage" name="row[course_id]" type="text" value="{$row.course_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Shop_id')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-shop_id" min="0" placeholder="请选择" data-rule="required" data-source="xilufitness/shop/index" data-field="shop_name" class="form-control selectpage" name="row[shop_id]" type="text" value="{$row.shop_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Coach_id')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-coach_id" min="0" placeholder="请选择" data-rule="required" data-source="xilufitness/coach/index" data-field="coach_name" class="form-control selectpage" name="row[coach_id]" type="text" value="{$row.coach_id|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Class_time')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                <input id="c-class_time" min="0" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[class_time]" type="text" value="{:$row.class_time?date('Y-m-d',$row.class_time):''}">
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Duration')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-4">
            <div class="input-group">
                <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                <input id="c-start_at" placeholder="请选择开始时间" data-rule="required" class="form-control datetimepicker" data-date-format="HH:mm:00" name="row[start_at]" type="text" value="{$row.start_at|htmlentities}">
            </div>
        </div>
        <div class="col-xs-12 col-sm-4">
            <div class="input-group">
                <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                <input id="c-end_at" placeholder="请选择结束时间" data-rule="required" class="form-control datetimepicker" name="row[end_at]" data-date-format="HH:mm:00" type="text" value="{$row.end_at|htmlentities}">
            </div>

        </div>

    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Sign_count')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sign_count" placeholder="请输入" data-rule="required" class="form-control" name="row[sign_count]" type="number" value="{$row.sign_count|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Wait_count')}<span style="color: red;">*</span>:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-wait_count" placeholder="请输入" data-rule="required" class="form-control" name="row[wait_count]" type="number" value="{$row.wait_count|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Course_price')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-course_price" readonly min="0" class="form-control" step="0.01" type="number" value="{$row.course_price|htmlentities}">
                <div class="input-group-addon">/{:__('People')}</div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Write_off_price')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-write_off_price" readonly min="0" class="form-control" step="0.01" type="number" value="{$row.write_off_price|htmlentities}">
                <div class="input-group-addon">/{:__('People')}</div>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Class_count')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-class_count" min="0" readonly class="form-control" type="number" value="{$row.class_count|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
